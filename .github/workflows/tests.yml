name: Automated Tests & CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Set up FFmpeg (Windows & Linux)
        if: runner.os != 'macOS'
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Set up FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install ffmpeg
          fi
          ffmpeg -version

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1 libegl1 libglx-mesa0 libxkbcommon-x11-0 libdbus-1-3 libfontconfig1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 \
            libpulse0 xvfb \
            libgstreamer1.0-0 gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio

      - name: Install Python Dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip pytest
          if [ "${{ runner.os }}" = "macOS" ]; then
            python -m pip install torch torchvision torchaudio
            python -m pip install -r requirements.txt
          else
            python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
            python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Run Test Suite
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python -m pytest tests/ -v
          else
            python -m pytest tests/ -v
          fi

      - name: Test Optional MCP Gateway in Separate Environment
        shell: bash
        run: |
          python -m venv --system-site-packages .mcp-test-env
          if [ "${{ runner.os }}" = "Windows" ]; then
            MCP_PYTHON=".mcp-test-env/Scripts/python.exe"
          else
            MCP_PYTHON=".mcp-test-env/bin/python"
          fi
          "$MCP_PYTHON" -m pip install -r requirements-mcp.txt
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a "$MCP_PYTHON" -m pytest tests/test_agent_commands.py tests/test_agent_bridge.py tests/test_agent_controls.py tests/test_mcp_adapter.py -v
          else
            "$MCP_PYTHON" -m pytest tests/test_agent_commands.py tests/test_agent_bridge.py tests/test_agent_controls.py tests/test_mcp_adapter.py -v
          fi

      - name: Set up Node for Windows Inspector Gate
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test Pinned Inspector CLI (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          npm install --prefix .temp/mcp-inspector --ignore-scripts --no-audit --no-fund @modelcontextprotocol/inspector@2.10.1
          export VOICER_INSPECTOR_ENTRY="$GITHUB_WORKSPACE/.temp/mcp-inspector/node_modules/@modelcontextprotocol/inspector/clients/launcher/build/index.js"
          .mcp-test-env/Scripts/python.exe -m pytest tests/test_mcp_adapter.py -k inspector -v
